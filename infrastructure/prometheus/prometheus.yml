global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: '/platform/metrics'

  - job_name: 'analyzer'
    static_configs:
      - targets: ['analyzer:9090']
    metrics_path: '/metrics'
