version: '3.9'

services:

  # ── Kafka (KRaft mode — no ZooKeeper) ──────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_NUM_PARTITIONS: 12
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka UI ────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Topic Initializer (runs once) ────────────────────────────────────────────
  kafka-init:
    build:
      context: .
      dockerfile: infrastructure/kafka/Dockerfile.init
    container_name: kafka-init
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ── API Threat Gateway ────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "3000:3000"
    environment:
      APPLICATION_ID: sample-app
      UPSTREAM_URL: http://sample-app:4000
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FAIL_CLOSED: "false"
      SAMPLE_APP_API_KEY: sample-app-secret
      LOG_LEVEL: info
      PORT: 3000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/platform/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Threat Analyzer Service ───────────────────────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: analyzers/Dockerfile
    container_name: analyzer
    environment:
      APPLICATION_ID: sample-app
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: threat-analyzers
      REDIS_HOST: redis
      REDIS_PORT: 6379
      THREAT_TTL_SECONDS: 300
      LOG_LEVEL: info
      CS_WINDOW_SECONDS: 60
      CS_MAX_IP_FAILURES: 10
      CS_MAX_USER_FAILURES: 5
      CS_MAX_DISTINCT_ACCOUNTS: 5
      CS_MAX_DISTINCT_IPS: 4
      BOLA_WINDOW_SECONDS: 120
      BOLA_MAX_DISTINCT_RESOURCES: 20
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Sample Vulnerable App ─────────────────────────────────────────────────────
  sample-app:
    build:
      context: .
      dockerfile: sample-app/Dockerfile
    container_name: sample-app
    environment:
      PORT: 4000
      JWT_SECRET: dev-jwt-secret-change-in-prod
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

volumes:
  kafka_data:
  grafana_data:
